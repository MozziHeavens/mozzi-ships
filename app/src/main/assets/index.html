<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mozzi Ships</title>
<style>
  :root{
    --cielo-alto:#0E7FD0; --cielo:#3FB7E8; --bruma:#C9F3FF;
    --azul-hondo:#06427A; --pasto:#5BC236; --pasto-claro:#9BE36A;
    --h: min(60vw, 42vh);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    font-family:"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    color:var(--azul-hondo);
    background:linear-gradient(var(--cielo-alto) 0%, var(--cielo) 38%, var(--bruma) 72%);
    display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;
    user-select:none;
  }
  /* Sol suave arriba */
  body::before{
    content:"";position:fixed;top:-25vmin;left:50%;width:90vmin;height:90vmin;
    transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.55), rgba(255,255,255,0) 60%);
    pointer-events:none;
  }
  .colinas{position:fixed;left:0;right:0;bottom:0;height:30vh;pointer-events:none}
  .colinas svg{width:100%;height:100%;display:block}

  /* Burbujas */
  .burbujas{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .burbuja{
    position:absolute;bottom:-80px;border-radius:50%;
    background:radial-gradient(circle at 30% 28%, rgba(255,255,255,.95) 0 8%, rgba(255,255,255,.18) 30%, rgba(255,255,255,.04) 65%, rgba(255,255,255,.35) 100%);
    border:1px solid rgba(255,255,255,.55);
    animation:subir linear infinite;
  }
  @keyframes subir{
    from{transform:translate(0,0)}
    50%{transform:translate(18px,-55vh)}
    to{transform:translate(-10px,-115vh)}
  }

  header{position:relative;text-align:center;z-index:2;margin-top:2vh}
  h1{
    margin:0;font-size:clamp(38px,11vw,64px);font-weight:800;letter-spacing:-.03em;line-height:1;
    color:#fff;
    text-shadow:0 2px 0 #7FD4FF, 0 4px 0 #1B78C4, 0 10px 22px rgba(4,50,100,.45);
  }
  .sub{margin:.5em 0 0;font-size:15px;color:#E9FAFF;text-shadow:0 1px 2px rgba(4,50,100,.5)}

  /* Carrusel de cartuchos */
  .riel{
    position:relative;z-index:2;width:100%;
    display:flex;gap:4vw;align-items:center;
    overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
    padding:3vh calc(50vw - var(--h)*.45);
  }
  .riel::-webkit-scrollbar{display:none}

  .cart{
    flex:0 0 auto;width:calc(var(--h)*.9);height:var(--h);
    scroll-snap-align:center;position:relative;
    border-radius:24px 24px 14px 14px;
    background:linear-gradient(165deg, rgba(255,255,255,.85), rgba(214,230,242,.55) 40%, rgba(150,175,196,.6));
    border:1px solid rgba(255,255,255,.9);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.95), inset 0 -8px 16px rgba(60,90,120,.18), 0 16px 30px rgba(4,55,105,.35);
    transform:scale(.84);opacity:.65;
    transition:transform .28s ease, opacity .28s ease, filter .28s ease;
  }
  .cart.activo{transform:scale(1);opacity:1}
  /* Estrías de agarre */
  .cart::before{
    content:"";position:absolute;top:5%;left:14%;right:14%;height:9%;border-radius:8px;
    background:repeating-linear-gradient(90deg, rgba(40,70,100,.18) 0 3px, rgba(255,255,255,.35) 3px 5px, transparent 5px 10px);
  }
  /* Conector de abajo */
  .cart::after{
    content:"";position:absolute;bottom:-7px;left:28%;right:28%;height:12px;
    border-radius:0 0 10px 10px;background:linear-gradient(rgba(140,160,180,.9), rgba(95,118,140,.9));
  }
  .etiqueta{
    position:absolute;left:10%;right:10%;top:19%;bottom:9%;border-radius:14px;overflow:hidden;
    background:linear-gradient(170deg, color-mix(in srgb, var(--c) 70%, white), var(--c) 55%, color-mix(in srgb, var(--c) 75%, black));
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6%;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.35);
  }
  .etiqueta::after{
    content:"";position:absolute;left:-10%;right:-10%;top:-30%;height:62%;border-radius:0 0 50% 50%;
    background:linear-gradient(rgba(255,255,255,.6), rgba(255,255,255,.08));
  }
  .etiqueta svg{width:44%;height:auto;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));position:relative;z-index:1}
  .etiqueta .nom{
    position:relative;z-index:1;color:#fff;font-weight:800;text-align:center;padding:0 8%;
    font-size:calc(var(--h)*.075);line-height:1.1;text-shadow:0 2px 3px rgba(0,0,0,.35);
  }
  .cart.falta .etiqueta{filter:grayscale(.85) brightness(.95)}

  /* Panel de vidrio */
  .panel{
    position:relative;z-index:2;width:min(92vw,520px);
    display:flex;align-items:center;gap:18px;padding:14px 16px 14px 22px;
    border-radius:30px;
    background:linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,.25));
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.85);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.9), 0 10px 26px rgba(4,55,105,.25);
    margin-bottom:3vh;
  }
  .datos{flex:1;min-width:0}
  .titulo{margin:0;font-size:21px;font-weight:800;color:var(--azul-hondo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .motor{margin:2px 0 8px;font-size:14px;color:#1F5F92}
  .estado{display:inline-block;font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;color:#fff;
    background:linear-gradient(#55D46A,#1E9B3A);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
  .estado.no{background:linear-gradient(#B9C4CE,#7F8C98)}
  .puntos{display:flex;gap:7px;margin-top:10px}
  .punto{width:10px;height:10px;border-radius:50%;background:var(--c);opacity:.35;border:none;padding:0;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.7)}
  .punto.activo{opacity:1;transform:scale(1.25)}

  /* Botón A estilo N64 */
  .botonA{
    flex:0 0 auto;width:88px;height:88px;border-radius:50%;border:none;position:relative;
    font:800 40px/1 "Segoe UI",Roboto,sans-serif;color:#fff;
    background:radial-gradient(circle at 35% 30%, #A9C8FF 0%, #3B6FD0 45%, #1A3F8C 100%);
    box-shadow: inset 0 -7px 12px rgba(0,0,0,.28), inset 0 3px 0 rgba(255,255,255,.5), 0 9px 18px rgba(10,45,115,.45);
    text-shadow:0 2px 2px rgba(0,0,0,.35);
    transition:transform .1s ease;
  }
  .botonA::after{
    content:"";position:absolute;left:18%;right:18%;top:8%;height:38%;border-radius:50%;
    background:linear-gradient(rgba(255,255,255,.7), rgba(255,255,255,0));
  }
  .botonA:active{transform:scale(.93)}
  .botonA small{display:block;font-size:12px;font-weight:700;margin-top:2px;letter-spacing:.02em}
  .botonA:disabled{filter:grayscale(.8);opacity:.75}
  button:focus-visible,.cart:focus-visible{outline:3px solid #fff;outline-offset:4px}

  .aviso{
    position:fixed;left:50%;bottom:5vh;transform:translate(-50%,30px);opacity:0;z-index:5;
    width:min(88vw,460px);padding:12px 18px;border-radius:18px;text-align:center;font-size:15px;
    background:rgba(255,255,255,.85);color:var(--azul-hondo);
    box-shadow:0 10px 24px rgba(4,55,105,.3);transition:all .3s ease;pointer-events:none;
  }
  .aviso.ver{opacity:1;transform:translate(-50%,0)}

  @media (orientation:landscape){
    :root{--h:min(30vw,52vh)}
    header{margin-top:1vh}
    h1{font-size:clamp(30px,6vh,52px)}
    .sub{display:none}
    .riel{padding-top:1.5vh;padding-bottom:1.5vh}
    .panel{margin-bottom:2vh;padding:10px 14px 10px 20px}
    .botonA{width:72px;height:72px;font-size:32px}
  }
  @media (prefers-reduced-motion:reduce){
    .burbuja{display:none}
    .cart{transition:none}
  }
</style>
</head>
<body>

<div class="burbujas" id="burbujas" aria-hidden="true"></div>

<div class="colinas" aria-hidden="true">
  <svg viewBox="0 0 400 120" preserveAspectRatio="none">
    <defs>
      <linearGradient id="p1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#B6F07E"/><stop offset=".35" stop-color="#5BC236"/><stop offset="1" stop-color="#2E8A1F"/>
      </linearGradient>
      <linearGradient id="p2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9BE36A"/><stop offset="1" stop-color="#3FA52B"/>
      </linearGradient>
    </defs>
    <path d="M0 70 C70 30 150 40 210 62 C270 84 330 46 400 52 L400 120 L0 120Z" fill="url(#p2)" opacity=".9"/>
    <path d="M0 92 C90 58 170 78 240 86 C310 94 350 70 400 76 L400 120 L0 120Z" fill="url(#p1)"/>
    <path d="M30 84 C100 62 160 70 220 80" stroke="rgba(255,255,255,.55)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>
</div>

<header>
  <h1>Mozzi Ships</h1>
  <p class="sub">Desliza para elegir un cartucho</p>
</header>

<div class="riel" id="riel" role="listbox" aria-label="Juegos"></div>

<div class="panel">
  <div class="datos">
    <p class="titulo" id="titulo"></p>
    <p class="motor" id="motor"></p>
    <span class="estado" id="estado"></span>
    <div class="puntos" id="puntos"></div>
  </div>
  <button class="botonA" id="botonA" aria-label="Jugar">A<small>Jugar</small></button>
</div>

<div class="aviso" id="aviso" role="status"></div>

<script>
  // ===== Lista de juegos: para agregar uno nuevo, copia una línea y cambia los datos =====
  const juegos = [
    { nombre: "Ocarina of Time", motor: "Ship of Harkinian universal", pkg: "com.mozzi.sohuniversal", color: "#1FA14A", icono: "nota" },
    { nombre: "Majora's Mask",   motor: "2 Ship 2 Harkinian",          pkg: "com.twoshipfork.mm",     color: "#E4202E", icono: "luna" },
    { nombre: "Super Mario 64",  motor: "Ghostship",                   pkg: "dev.net64.ghostship",    color: "#F2B705", icono: "estrella" },
    { nombre: "Star Fox 64",     motor: "Starship",                    pkg: "com.starship.android",   color: "#2A5DB0", icono: "nave" },
    { nombre: "ReBoom",          motor: "Tu mod de Ocarina",           pkg: "com.dishii.soh",         color: "#7B3FC4", icono: "reloj" }
  ];

  const iconos = {
    nota: '<svg viewBox="0 0 64 64"><path fill="#fff" d="M46 6v34a10 10 0 1 1-5-8.7V17l-18 5v24a10 10 0 1 1-5-8.7V14z"/></svg>',
    luna: '<svg viewBox="0 0 64 64"><path fill="#fff" d="M40 6a27 27 0 1 0 18 40A22 22 0 1 1 40 6z"/></svg>',
    estrella: '<svg viewBox="0 0 64 64"><polygon fill="#fff" points="32,4 40,23 60,24 44,37 50,58 32,46 14,58 20,37 4,24 24,23"/></svg>',
    nave: '<svg viewBox="0 0 64 64"><path fill="#fff" d="M32 4 L54 54 L32 43 L10 54 Z"/><path fill="rgba(0,0,0,.18)" d="M32 4 L32 43 L10 54 Z"/></svg>',
    reloj: '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="24" fill="none" stroke="#fff" stroke-width="7"/><path d="M32 17v16l11 8" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };

  const puente = window.Ships;
  const estaInstalado = pkg => puente ? puente.instalado(pkg) : true;

  const riel = document.getElementById('riel');
  const puntos = document.getElementById('puntos');
  const $titulo = document.getElementById('titulo');
  const $motor = document.getElementById('motor');
  const $estado = document.getElementById('estado');
  const $botonA = document.getElementById('botonA');
  const $aviso = document.getElementById('aviso');
  let activo = 0;
  let instalados = [];

  juegos.forEach((j, i) => {
    const c = document.createElement('div');
    c.className = 'cart';
    c.tabIndex = 0;
    c.setAttribute('role', 'option');
    c.style.setProperty('--c', j.color);
    c.innerHTML = '<div class="etiqueta">' + iconos[j.icono] + '<span class="nom">' + j.nombre + '</span></div>';
    c.addEventListener('click', () => { i === activo ? jugar() : irA(i); });
    riel.appendChild(c);

    const p = document.createElement('button');
    p.className = 'punto';
    p.style.setProperty('--c', j.color);
    p.setAttribute('aria-label', j.nombre);
    p.addEventListener('click', () => irA(i));
    puntos.appendChild(p);
  });
  const carts = [...riel.children];
  const dots = [...puntos.children];

  function refrescar() {
    instalados = juegos.map(j => estaInstalado(j.pkg));
    carts.forEach((c, i) => c.classList.toggle('falta', !instalados[i]));
    pintar();
  }
  window.refrescar = refrescar;

  function pintar() {
    const j = juegos[activo];
    carts.forEach((c, i) => { c.classList.toggle('activo', i === activo); c.setAttribute('aria-selected', i === activo); });
    dots.forEach((d, i) => d.classList.toggle('activo', i === activo));
    $titulo.textContent = j.nombre;
    $motor.textContent = j.motor;
    const ok = instalados[activo];
    $estado.textContent = ok ? 'Listo para jugar' : 'No instalado';
    $estado.classList.toggle('no', !ok);
    $botonA.disabled = !ok;
  }

  function irA(i) {
    i = Math.max(0, Math.min(juegos.length - 1, i));
    carts[i].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    activo = i; pintar();
  }

  function avisar(texto) {
    $aviso.textContent = texto;
    $aviso.classList.add('ver');
    clearTimeout(avisar.t);
    avisar.t = setTimeout(() => $aviso.classList.remove('ver'), 3200);
  }

  function jugar() {
    const j = juegos[activo];
    if (!instalados[activo]) { avisar(j.nombre + ' no está instalado. Instala su APK desde Descargas › Ships.'); return; }
    const ok = puente ? puente.abrir(j.pkg) : true;
    if (!ok) avisar('No se pudo abrir ' + j.nombre + '. Revisa que la app esté instalada.');
  }
  $botonA.addEventListener('click', jugar);

  // Detectar el cartucho del centro al deslizar
  let t;
  riel.addEventListener('scroll', () => {
    clearTimeout(t);
    t = setTimeout(() => {
      const centro = riel.scrollLeft + riel.clientWidth / 2;
      let mejor = 0, dist = Infinity;
      carts.forEach((c, i) => {
        const d = Math.abs(c.offsetLeft + c.offsetWidth / 2 - centro);
        if (d < dist) { dist = d; mejor = i; }
      });
      if (mejor !== activo) { activo = mejor; pintar(); }
    }, 60);
  });

  // Control / teclado
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { irA(activo + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { irA(activo - 1); e.preventDefault(); }
    else if (e.key === 'Enter' || e.key === ' ' || e.key === 'GamepadA') { jugar(); e.preventDefault(); }
  });

  // Burbujas
  const capa = document.getElementById('burbujas');
  for (let i = 0; i < 14; i++) {
    const b = document.createElement('div');
    b.className = 'burbuja';
    const s = 14 + Math.random() * 46;
    b.style.width = b.style.height = s + 'px';
    b.style.left = (Math.random() * 100) + 'vw';
    b.style.animationDuration = (14 + Math.random() * 16) + 's';
    b.style.animationDelay = (-Math.random() * 30) + 's';
    capa.appendChild(b);
  }

  refrescar();
  requestAnimationFrame(() => irA(0));
</script>
</body>
</html>
